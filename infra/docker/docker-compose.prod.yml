name: nexploy

services:
  postgres:
    image: postgres:18.0
    container_name: nexploy_postgres
    restart: always
    networks:
      - app
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexploy}
      POSTGRES_USER: ${POSTGRES_USER:-nexploy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - db:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexploy}"]
      interval: 2s
      timeout: 3s
      retries: 15

  nexploy:
    image: nexploy/nexploy:latest
    pull_policy: always
    container_name: nexploy_app
    restart: always
    networks:
      - app
      - edge
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexploy}:${POSTGRES_PASSWORD}@nexploy_postgres:5432/${POSTGRES_DB:-nexploy}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${NEXPLOY_PUBLIC_URL:?NEXPLOY_PUBLIC_URL is required}
      NEXPLOY_URL: ${NEXPLOY_PUBLIC_URL}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      DOCKER_API_URL: http://nexploy_docker_api:3300
      DEPLOYER_WORK_DIR: /tmp/deployer
      INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY:?INNGEST_EVENT_KEY is required}
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY:?INNGEST_SIGNING_KEY is required}
      INNGEST_BASE_URL: http://nexploy_inngest:8288
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
      TRAEFIK_SERVICE_DIR: /etc/nexploy/traefik/service
      TRAEFIK_CERTS_CONTAINER_PATH: /etc/nexploy/traefik/service/certs
      TRAEFIK_STATIC_CONFIG_PATH: /etc/nexploy/traefik/traefik.yml
      TRAEFIK_USE_TLS: ${TRAEFIK_USE_TLS:-true}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ${NEXPLOY_DIR:-/etc/nexploy}/traefik:/etc/nexploy/traefik
      - deployer_workdir:/tmp/deployer
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=nexploy_traefik_network"
      - "traefik.http.routers.nexploy-app.rule=Host(`${DOMAIN:?DOMAIN is required}`)"
      - "traefik.http.routers.nexploy-app.entrypoints=websecure"
      - "traefik.http.routers.nexploy-app.tls.certresolver=letsencrypt"
      - "traefik.http.routers.nexploy-app.middlewares=gzip-compress@file,security-headers@file"
      - "traefik.http.services.nexploy-app.loadbalancer.server.port=3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://0.0.0.0:3000 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  traefik:
    image: traefik:v3.6.2
    container_name: nexploy_traefik
    restart: always
    networks:
      - edge
      - app
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - ${NEXPLOY_DIR:-/etc/nexploy}/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ${NEXPLOY_DIR:-/etc/nexploy}/traefik/service:/etc/nexploy/traefik/service
      - traefik_acme:/etc/traefik/acme
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
    depends_on:
      nexploy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  docker-api:
    image: nexploy/docker-api:latest
    pull_policy: always
    container_name: nexploy_docker_api
    restart: always
    networks:
      - app
    environment:
      NODE_ENV: production
      PORT: 3300
      DOCKER_SOCKET: /var/run/docker.sock
      NEXPLOY_API_URL: http://nexploy_app:3000
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRAEFIK_CONTAINER_NAME: nexploy_traefik
      TRAEFIK_NETWORK_NAME: nexploy_traefik_network
      NEXPLOY_APP_CONTAINER_NAME: nexploy_app
      DOCKER_API_CONTAINER_NAME: nexploy_docker_api
      TRAEFIK_SERVICE_DIR: /etc/nexploy/traefik/service
      TRAEFIK_STATIC_CONFIG_PATH: /etc/nexploy/traefik/traefik.yml
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - ${NEXPLOY_DIR:-/etc/nexploy}/traefik:/etc/nexploy/traefik
      - deployer_workdir:/tmp/deployer
    depends_on:
      nexploy:
        condition: service_healthy
    expose:
      - "3300"

  inngest:
    image: inngest/inngest:v1.14.0
    container_name: nexploy_inngest
    restart: always
    networks:
      - app
    environment:
      INNGEST_EVENT_KEY: ${INNGEST_EVENT_KEY}
      INNGEST_SIGNING_KEY: ${INNGEST_SIGNING_KEY}
    command: inngest start -u http://nexploy_app:3000/api/inngest
    depends_on:
      nexploy:
        condition: service_healthy

volumes:
  db:
    name: nexploy_db
  traefik_acme:
    name: nexploy_traefik_acme
  deployer_workdir:
    name: nexploy_deployer_workdir

networks:
  app:
    name: nexploy_network
    driver: bridge
  edge:
    name: nexploy_traefik_network
    driver: bridge
