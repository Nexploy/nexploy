name: nexploy_test
services:
  postgres:
    image: postgres:18.0
    container_name: nexploy_postgres_test
    ports:
      - "5434:5432"
    environment:
      - "POSTGRES_DB=nexploy_test"
      - "POSTGRES_USER=nexploy"
      - "POSTGRES_PASSWORD=nexploy"
    tmpfs:
      - /var/lib/postgresql:size=2g
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U nexploy -d nexploy_test" ]
      interval: 2s
      timeout: 3s
      retries: 30

  dind:
    image: docker:28-dind
    container_name: nexploy_dind_test
    privileged: true
    command: [ "--tls=false" ]
    environment:
      - DOCKER_TLS_CERTDIR=
    ports:
      - "12375:2375"
    healthcheck:
      test: [ "CMD", "docker", "info" ]
      interval: 2s
      timeout: 3s
      retries: 40

  inngest:
    image: inngest/inngest:v1.31.0
    container_name: nexploy_inngest_test
    ports:
      - "8299:8288"
    environment:
      - INNGEST_EVENT_KEY=local-dev-key
      - INNGEST_SIGNING_KEY=signkey-test-12345678
    command: inngest dev --no-discovery
