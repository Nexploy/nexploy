http:
  middlewares:
    upgrading:
      plugin:
        staticresponse:
          statusCode: 503
          headers:
            Content-Type:
              - text/html; charset=utf-8
            Cache-Control:
              - no-store
          body: |
            <!DOCTYPE html>
            <html lang="en">
            <head>
                <meta charset="UTF-8" />
                <meta http-equiv="refresh" content="5" />
                <meta name="viewport" content="width=device-width, initial-scale=1.0" />
                <meta name="robots" content="noindex, nofollow" />
                <title>Nexploy is updating…</title>
                <script>
                    (function () {
                        try {
                            var stored = localStorage.getItem('theme');
                            var isDark =
                                stored === 'dark' ||
                                ((!stored || stored === 'system') &&
                                    window.matchMedia('(prefers-color-scheme: dark)').matches);
                            if (isDark) document.documentElement.classList.add('dark');
                            document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
                        } catch (e) {}
                    })();
                </script>
                <style>
                    :root {
                        --background: oklch(1 0 0);
                        --foreground: oklch(0.145 0 0);
                        --card: oklch(1 0 0);
                        --card-foreground: oklch(0.145 0 0);
                        --primary: oklch(0.5465 0.2455 262.8657);
                        --primary-foreground: oklch(0.985 0 0);
                        --muted: oklch(0.97 0 0);
                        --muted-foreground: oklch(0.556 0 0);
                        --accent: oklch(0.97 0 0);
                        --accent-foreground: oklch(0.5465 0.2455 262.8657);
                        --border: oklch(0.922 0 0);
                        --input: oklch(0.922 0 0);
                        --ring: oklch(0.5465 0.2455 262.8657);
                        --radius: 0.625rem;
                        --radius-md: calc(var(--radius) - 2px);
                        --shadow-xs: 0 1px 3px 0px hsl(0 0% 0% / 0.05);
                        --shadow-lg: 0 1px 3px 0px hsl(0 0% 0% / 0.1), 0 4px 6px -1px hsl(0 0% 0% / 0.1);
                        --button-surface: var(--background);
                        --button-border: var(--border);
                        --button-hover: var(--accent);
                        --font-sans:
                            ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
                            'Helvetica Neue', Arial, 'Noto Sans', sans-serif, 'Apple Color Emoji',
                            'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji';
                    }

                    .dark {
                        --background: oklch(0.145 0 0);
                        --foreground: oklch(0.985 0 0);
                        --card: oklch(0.205 0 0);
                        --card-foreground: oklch(0.985 0 0);
                        --primary: oklch(0.5465 0.2455 262.8657);
                        --primary-foreground: oklch(0.985 0 0);
                        --muted: oklch(0.269 0 0);
                        --muted-foreground: oklch(0.708 0 0);
                        --accent: oklch(0.371 0 0);
                        --accent-foreground: oklch(0.5465 0.2455 262.8657);
                        --border: oklch(0.313 0 89.876);
                        --input: oklch(0.325 0 0);
                        --shadow-xs: 0 1px 3px 0px hsl(0 0% 0% / 0.2);
                        --shadow-lg: 0 1px 3px 0px hsl(0 0% 0% / 0.3), 0 4px 6px -1px hsl(0 0% 0% / 0.3);
                        --button-surface: color-mix(in oklab, var(--input) 30%, transparent);
                        --button-border: var(--input);
                        --button-hover: color-mix(in oklab, var(--input) 50%, transparent);
                    }

                    * { margin: 0; padding: 0; box-sizing: border-box; }
                    html, body { height: 100%; }

                    body {
                        font-family: var(--font-sans);
                        background: var(--background);
                        color: var(--foreground);
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        padding: 24px;
                        -webkit-font-smoothing: antialiased;
                        text-rendering: optimizeLegibility;
                    }

                    main {
                        width: 100%;
                        max-width: 420px;
                        background: var(--card);
                        color: var(--card-foreground);
                        border: 1px solid var(--border);
                        border-radius: calc(var(--radius) + 6px);
                        box-shadow: var(--shadow-lg);
                        padding: 44px 36px 28px;
                        text-align: center;
                    }

                    .icon {
                        width: 56px;
                        height: 56px;
                        margin: 0 auto 26px;
                        border-radius: var(--radius);
                        background: color-mix(in oklab, var(--primary) 12%, transparent);
                        color: var(--primary);
                        display: flex;
                        align-items: center;
                        justify-content: center;
                    }
                    .icon svg {
                        width: 28px;
                        height: 28px;
                        animation: spin 2.4s linear infinite;
                    }

                    @keyframes spin {
                        from { transform: rotate(0deg); }
                        to { transform: rotate(360deg); }
                    }

                    @media (prefers-reduced-motion: reduce) {
                        .icon svg { animation: none; }
                    }

                    h1 {
                        font-size: 1.3rem;
                        font-weight: 650;
                        letter-spacing: -0.02em;
                        line-height: 1.3;
                        margin-bottom: 10px;
                    }

                    p {
                        font-size: 0.925rem;
                        line-height: 1.6;
                        color: var(--muted-foreground);
                    }
                    p + p { margin-top: 6px; }

                    .actions {
                        margin-top: 30px;
                        padding-top: 22px;
                        border-top: 1px solid var(--border);
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        gap: 8px;
                        flex-wrap: wrap;
                    }

                    .button {
                        display: inline-flex;
                        align-items: center;
                        justify-content: center;
                        gap: 0.375rem;
                        white-space: nowrap;
                        height: 2rem;
                        padding: 0 0.625rem;
                        border-radius: var(--radius-md);
                        border: 1px solid transparent;
                        font-size: 0.875rem;
                        font-weight: 500;
                        line-height: 1;
                        text-decoration: none;
                        cursor: pointer;
                        transition: all 0.15s ease;
                        outline: none;
                    }
                    .button svg { width: 1rem; height: 1rem; flex-shrink: 0; }
                    .button:focus-visible {
                        border-color: var(--ring);
                        box-shadow: 0 0 0 3px color-mix(in oklab, var(--ring) 50%, transparent);
                    }

                    .button-outline {
                        background: var(--button-surface);
                        border-color: var(--button-border);
                        color: var(--foreground);
                        box-shadow: var(--shadow-xs);
                    }
                    .button-outline:hover {
                        background: var(--button-hover);
                        color: var(--accent-foreground);
                    }

                    .button-ghost {
                        background: transparent;
                        color: var(--muted-foreground);
                    }
                    .button-ghost:hover {
                        background: var(--accent);
                        color: var(--accent-foreground);
                    }
                    .dark .button-ghost:hover {
                        background: color-mix(in oklab, var(--accent) 50%, transparent);
                    }
                </style>
            </head>
            <body>
                <main>
                    <div class="icon" aria-hidden="true">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
                    </div>
                    <h1>Nexploy is being updated</h1>
                    <p>We're applying an update and will be back in just a moment.</p>
                    <p>This page will refresh automatically.</p>
                    <div class="actions">
                        <a class="button button-ghost" href="https://nexploy.app" target="_blank" rel="noopener noreferrer">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 487.17 534.98" fill="currentColor" aria-hidden="true"><path d="M238.51.17c7.92-.91,23.2,1.96,30.01,5.79,24.03,13.5,49.22,28.39,72.96,42.22l75.35,43.86,25.33,14.73c8.74,5.11,17.38,9.7,24.8,16.7,12.33,11.49,19.55,27.43,20.04,44.28.4,12.97.01,27.9,0,41,.11,32.11-.05,64.22-.47,96.32l-.22,53.11c-.04,8.56.05,17.48-.34,26.03-.1,2.24-1.75,5.09-3.39,6.62-7.3,6.84-16.65,9.79-26.37,9.98-9.51.05-20.29-3.13-28.3-8.14-7.45-4.66-13.9-11.1-20.03-17.19-8-7.95-15.92-15.91-23.88-23.88l-67.24-67.27-64.51-64.5c-21.09-21.08-39.31-40.14-62.74-58.96-29.26-23.5-61.9-36.39-99.92-32.39C55.46,132.06,21.32,151.54.02,178.41c-.34-19.66,3.69-35.85,16.54-51.09,12.12-14.38,34-24.93,50.37-34.46l68.51-39.9,51.65-30.17C204.73,12.39,217.54,2.22,238.51.17Z"/><path d="M98.69,193.66c31.29-2.02,49.47,15.92,69.75,36.18l25.79,25.8,99.78,99.71,43.63,43.53c37.94,37.82,75.42,81.09,135.18,59.91-1.91,2.63-3.94,5.35-6.09,7.78-2.92,3.31-6.24,6.25-9.87,8.76-12.45,8.58-33.19,20.13-46.59,28.13l-31.65,18.82c-5.99,3.56-11.95,7.17-18.03,10.57-5.06,2.83-8.48,3.12-12.95-.88-6.78-6.06-13.12-12.71-19.6-19.11l-39.96-39.46-101.31-100.38-29.8-29.55c-4.2-4.16-11.63-12.05-15.92-15.34-6.16-1.32-7.01,4.36-7.01,8.94-.01,9.32-.03,18.66-.04,27.98l-.05,92.28c0,14.88.15,29.75.06,44.63-.05,8.2-4.9,12.66-12.83,8.37-8.52-4.62-16.83-9.62-25.18-14.54-8.47-4.95-16.88-9.99-25.24-15.13-6.13-3.74-12.21-7.17-17.78-11.76-11.96-9.71-19.42-23.9-20.64-39.26-.64-7.41-.28-19.52-.27-27.22,0-17.71.08-35.42.27-53.13l.07-54.86c.02-28.25-2.07-53.36,18.1-76.21,13.44-15.24,27.89-22.83,48.16-24.57Z"/></svg>
                            Powered by Nexploy
                        </a>
                        <a class="button button-outline" href="https://github.com/Nexploy/nexploy" target="_blank" rel="noopener noreferrer">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5A11.5 11.5 0 0 0 .5 12a11.5 11.5 0 0 0 7.86 10.92c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.53-1.34-1.29-1.7-1.29-1.7-1.06-.72.08-.7.08-.7 1.17.08 1.78 1.2 1.78 1.2 1.04 1.78 2.73 1.27 3.4.97.1-.76.4-1.27.74-1.56-2.56-.29-5.25-1.28-5.25-5.7 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.8 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.12 3.05.74.81 1.18 1.84 1.18 3.1 0 4.43-2.69 5.4-5.26 5.69.41.36.78 1.06.78 2.14v3.17c0 .31.2.67.8.56A11.5 11.5 0 0 0 23.5 12 11.5 11.5 0 0 0 12 .5Z"/></svg>
                            GitHub
                        </a>
                    </div>
                </main>
            </body>
            </html>
